<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACC DB // TERMINAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f0a;
    --fg: #4dff88;
    --fg-dim: #1f8f3a;
    --fg-faint: #135225;
    --amber: #ffb300;
    --glow: rgba(77, 255, 136, 0.55);
    --font: 'VT323', monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    overflow: hidden;
  }

  /* subtle overall screen flicker */
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: 0.94; }
    94% { opacity: 1; }
  }

  .crt {
    position: relative;
    height: 100vh;
    width: 100vw;
    animation: flicker 7s infinite;
  }

  /* scanline overlay */
  .crt::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.15) 0px,
      rgba(0, 0, 0, 0.15) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 2;
  }

  /* soft vignette so edges fall off like a tube */
  .crt::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
    z-index: 3;
  }

  .screen {
    position: relative;
    z-index: 1;
    max-width: 900px;
    height: 100%;
    margin: 0 auto;
    padding: 28px 24px 16px;
    display: flex;
    flex-direction: column;
  }

  .output {
    flex: 1;
    overflow-y: auto;
    font-size: 20px;
    line-height: 1.45;
    text-shadow: 0 0 6px var(--glow);
    scrollbar-width: thin;
    scrollbar-color: var(--fg-dim) transparent;
  }

  .output::-webkit-scrollbar { width: 6px; }
  .output::-webkit-scrollbar-thumb { background: var(--fg-faint); }

  .line { white-space: pre-wrap; word-break: break-word; margin: 0 0 2px; }
  .dim { color: var(--fg-dim); }
  .amber { color: var(--amber); }
  .error { color: #ff5c5c; }
  .cmd-echo { color: var(--fg); }
  .cmd-echo::before { content: "> "; color: var(--amber); }

  .input-row {
    display: flex;
    align-items: center;
    font-size: 20px;
    padding-top: 8px;
    border-top: 1px solid var(--fg-faint);
    flex-shrink: 0;
  }

  .prompt {
    color: var(--amber);
    margin-right: 8px;
    text-shadow: 0 0 6px var(--glow);
  }

  #cmdInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--fg);
    font-family: var(--font);
    font-size: 20px;
    caret-color: var(--amber);
    text-shadow: 0 0 6px var(--glow);
  }

  a { color: var(--fg); text-decoration: underline; }
  a:hover { color: var(--amber); }

  @media (max-width: 600px) {
    .output, .input-row, #cmdInput { font-size: 18px; }
    .screen { padding: 18px 14px 12px; }
  }
</style>
</head>
<body>

<div class="crt">
  <div class="screen">
    <div class="output" id="output"></div>
    <div class="input-row">
      <span class="prompt" id="promptPath">~ &gt;</span>
      <input id="cmdInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="terminal command input">
    </div>
  </div>
</div>

<script>
/* ======================================================================
   EDIT ME — all site content lives in this one object. Swap in your own
   bio, project list, contact info and links. Every value here is either
   a plain string or an array of strings (one per line of output).
   ====================================================================== */
const CONTENT = {
  siteName: "The Asian Cloud City Educational Terminal",

  meta: [
    "This will be the only OOC entry on here, probably. This webpage",
    "is meant to mimic an information terminal, and inside of it you",
    "will find all of the current documentation about this project,",
    "usually in the form of in universe files and documents. Peace."
    
  ],

  // Each key becomes a filename (or, if you nest a { } object instead
  // of a [ ] list, a SUBFOLDER) inside the dir/ directory — see FS
  // and buildTree() below for how that's read.
  Dir: {
    "timeline": {
      "readme.txt": [
        "Select a year to see everything that happened in that year,",
        "sorted from most to least significant."
      ]
    },
     "locations": {
      "readme.txt": [
        "All locations we know of at the moment.",
      ]

     },
    "people": {
      "readme.txt": [
        "Notable figures and groups throughout history and current",
        "times. If you see any of these people, please contact us.",
        "We'd love to meet them!"
      ],
      "mask": {
        "group": [
            "I'm afraid there's nothing here right now.",
          ],
        "members": {
          "7": [
            "placeholder",
          ],
          "D": [
            "placeholder"
          ],
          "M": [
            "placeholder"
          ],
          "T": [
            "placeholder"
          ],
          "S": [
            "placeholder"
          ],
        }
      },

  
    },
    "recoveredfiles": {
      "readme.txt": [
        "A repository of files recovered from ACC research and recovery",
      "missions. Files are dated based on an estimate of their creation date",
      "Based on the contents within the files and where they were found."
      ]
    },

    "technology": {
      "readme.txt": [
        "An information bank about the various technologies that shape our life.",
        "From household appliances to cybernetics and medicine."
      ]
    },
  },

  // EDIT ME — real contact details
  contact: [
    "tumblr: axxelaxxelaxxel",
    "My asks are open."
  ],
  
};

/* ======================================================================
   buildTree() — turns a plain nested object into the file/folder
   structure FS needs, so you never have to write type:/children: by
   hand. The rule is just about the SHAPE of the value:
     - a [ ] list of strings      -> a FILE with those lines
     - a { } object               -> a FOLDER, and everything inside
                                      it goes through the same rule
                                      again (so folders can hold more
                                      folders, as deep as you want)
   ====================================================================== */
function buildTree(node) {
  if (Array.isArray(node)) {
    return { type: 'file', lines: node };
  }
  const children = {};
  for (const [key, value] of Object.entries(node)) {
    children[key] = buildTree(value);
  }
  return { type: 'dir', children };
}

const FS = {
  type: 'dir',
  children: {
    dir: buildTree(CONTENT.Dir)
  }
};

let cwd = []; // path segments relative to FS root, e.g. ['projects']

function nodeAt(pathArr) {
  let node = FS;
  for (const seg of pathArr) {
    if (!node.children || !node.children[seg]) return null;
    node = node.children[seg];
  }
  return node;
}

function pathString() {
  return cwd.length ? '~/' + cwd.join('/') : '~';
}

function updatePrompt() {
  document.getElementById('promptPath').textContent = pathString() + ' >';
}

/* ====================== boot sequence text ====================== */
const BOOT_LINES = [
  "ACCEDU-OS v1.0 // BOOTING",
  "MEM CHECK ....... OK",
  "LOADING KERNEL ... OK",
  "MOUNTING /home ... OK",
  "ERROR! PLEASE CONTA",
  "SYSTEM OVERRIDE CONFIRMED",
  "ADMIN ACCESS GRANTED",
  ""
];

/* ============================ engine ============================= */
const outputEl = document.getElementById('output');
const inputEl = document.getElementById('cmdInput');
const history = [];
let historyIndex = -1;

function printLine(text, cls) {
  const div = document.createElement('div');
  div.className = 'line' + (cls ? ' ' + cls : '');
  div.textContent = text;
  outputEl.appendChild(div);
}

function printLines(lines, cls) {
  lines.forEach(l => printLine(l, cls));
}

function scrollToBottom() {
  outputEl.scrollTop = outputEl.scrollHeight;
}

const COMMANDS = {
  help: () => {
    printLines([
      "Available commands:",
      "",
      "  META         message from the founder",
      "  ABOUT        about this terminal",
      "  DIR          list of directories",
      "  CONTACT      how to get in touch",
      "  WHOAMI       ...",
      "  DATE         current date/time",
      "  CLEAR        clear the screen",
      "",
      "  LS           list what's in the current directory",
      "  CD <dir>     move into a directory ( CD .. to go back, CD ~ for root )",
      "  CAT <file>   print a file's contents",
      "  PWD          show current directory",
      "",
      "  HELP         show this list again"
    ], 'dim');
  },
  meta: () => printLines(CONTENT.meta),
  about: () => printLines(["This is a terminal made and maintained by the Nanbu Kasite Tushu Guan",
    "for educating people across the ACC. Some files may be inaccessable to the public.",
    "Please enroll at any Academy under ACC jurisdiction to gain further access.",
    "Unauthorized access is punishable by law. Please understand that not everybody can be trusted.",
  ]),
  dir: () => {
    const node = FS.children.dir;
    printLine("dir/", 'dim');
    Object.keys(node.children).forEach(name => {
      const child = node.children[name];
      printLine('  ' + name + (child.type === 'dir' ? '/' : ''), 'dim');
    });
    printLine('');
    printLine("CD dir, then CAT <file> to read one (or CD into a subfolder first).", 'dim');
  },
  contact: () => printLines(CONTENT.contact),
  whoami: () => printLines([
    "I am MA-76, a librarian for the Nanbu Kasite Tushu Guan.",
    "Please disregard me and go about your studies."
  ], 'dim'),
  date: () => printLine(new Date().toString(), 'dim'),
  clear: () => { outputEl.innerHTML = ''; },
  sudo: () => printLine("V2h5IGFzaz8gWW91IGFscmVhZHkgYnJva2UgaW4u", 'error'),
  hi: () => printLine("Hello to you, too.", 'dim'),
  hello: () => printLine("Hello to you, too.", 'dim'),
  ma76: () => printLine("Hello! If you need help, type 'HELP'.",'dim'),

  ls: () => {
    const node = nodeAt(cwd);
    const names = Object.keys(node.children || {});
    if (names.length === 0) { printLine('(empty)', 'dim'); return; }
    names.forEach(name => {
      const child = node.children[name];
      printLine(name + (child.type === 'dir' ? '/' : ''), child.type === 'dir' ? 'amber' : '');
    });
  },
  cd: (arg) => {
    if (!arg || arg === '~' || arg === '/') { cwd = []; return; }
    if (arg === '..') { cwd.pop(); return; }
    const node = nodeAt(cwd);
    const target = node.children && node.children[arg];
    if (!target) { printLine(`cd: no such directory: ${arg}`, 'error'); return; }
    if (target.type !== 'dir') { printLine(`cd: not a directory: ${arg}`, 'error'); return; }
    cwd.push(arg);
  },
  cat: (arg) => {
    if (!arg) { printLine('usage: cat <file>', 'error'); return; }
    const node = nodeAt(cwd);
    const target = node.children && node.children[arg];
    if (!target) { printLine(`cat: no such file: ${arg}`, 'error'); return; }
    if (target.type !== 'file') { printLine(`cat: ${arg} is a directory`, 'error'); return; }
    printLines(target.lines);
  },
  pwd: () => printLine(pathString(), 'dim'),
};

function runCommand(raw) {
  const trimmed = raw.trim();
  if (trimmed.length === 0) return;

  printLine(trimmed, 'cmd-echo');
  history.push(trimmed);
  historyIndex = history.length;

  const [rawKey, ...rest] = trimmed.split(/\s+/);
  const key = rawKey.toLowerCase();
  const arg = rest.join(' ');

  if (COMMANDS[key]) {
    COMMANDS[key](arg);
  } else {
    printLine(`command not found: ${trimmed}  (try HELP)`, 'error');
  }
  updatePrompt();
  printLine('');
  scrollToBottom();
}

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    runCommand(inputEl.value);
    inputEl.value = '';
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (historyIndex > 0) {
      historyIndex--;
      inputEl.value = history[historyIndex];
    }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIndex < history.length - 1) {
      historyIndex++;
      inputEl.value = history[historyIndex];
    } else {
      historyIndex = history.length;
      inputEl.value = '';
    }
  }
});

document.addEventListener('click', () => inputEl.focus());

/* ============================ boot ============================= */
function boot() {
  let i = 0;
  const bootStep = () => {
    if (i < BOOT_LINES.length) {
      printLine(BOOT_LINES[i], 'dim');
      i++;
      scrollToBottom();
      setTimeout(bootStep, 140);
    } else {
      printLine(`Welcome to ${CONTENT.siteName}.`);
      printLine("Type HELP to see what's here.", 'dim');
      printLine('');
      updatePrompt();
      scrollToBottom();
      inputEl.focus();
    }
  };
  bootStep();
}

boot();
</script>
</body>
</html>
